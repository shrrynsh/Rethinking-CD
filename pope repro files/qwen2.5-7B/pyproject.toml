[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llava"
version = "1.1.3"
description = "Towards GPT-4 like large language and visual assistant."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    # torch/torchvision were bumped to satisfy transformers>=4.50 (required for
    # Qwen2.5-VL support). transformers refuses to register a PyTorch backend
    # at all on torch<2.1, which is what was happening before this change.
    "torch>=2.4", "torchvision>=0.19",
    # Pinned to the version actually installed/tested in this environment.
    # Qwen2.5-VL's generation internals (GenerationMixin._sample, cache
    # handling, etc.) differ across minor versions, so this is intentionally
    # an exact pin rather than an open range.
    "transformers==4.57.6", "tokenizers>=0.22.2", "sentencepiece==0.1.99", "shortuuid",
    "accelerate>=0.26.0", "peft==0.4.0", "bitsandbytes==0.41.0",
    "pydantic<2,>=1", "markdown2[all]", "numpy==1.26.4", "scikit-learn==1.2.2",
    "gradio==3.35.2", "gradio_client==0.2.9",
    "requests", "httpx==0.24.0", "uvicorn", "fastapi",
    "einops==0.6.1", "einops-exts==0.0.4", "timm==0.6.13",
    "qwen-vl-utils"
]

[project.optional-dependencies]
train = ["deepspeed==0.9.5", "ninja", "wandb"]

[project.urls]
"Homepage" = "https://llava-vl.github.io"
"Bug Tracker" = "https://github.com/haotian-liu/LLaVA/issues"

[tool.setuptools.packages.find]
exclude = ["assets*", "benchmark*", "docs", "dist*", "playground*", "scripts*", "tests*"]

[tool.wheel]
exclude = ["assets*", "benchmark*", "docs", "dist*", "playground*", "scripts*", "tests*"]